name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      REDIS_URL: redis://localhost:6379
      AUTH_JWT_SECRET: ci-test-secret-ci-test-secret-ci-test
      ENCRYPTION_KEY: ci-test-encryption-key-32-bytes!

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @saas/database generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm --filter @saas/database migrate:deploy

      - name: Seed database (roles and permissions)
        run: pnpm db:seed

      - name: Unit + integration tests
        run: pnpm test

      - name: Database consistency check
        run: pnpm db:check-consistency

      - name: Circular dependency check
        run: pnpm check:cycles

      - name: Duplicate code check
        run: pnpm check:duplicates

      - name: Dead code / unused dependency check (informational)
        # Real pre-existing findings exist (deps reserved for not-yet-wired features,
        # per docs/auth/ARCHITECTURE.md's TanStack Query gap) that are out of scope to
        # fix in this phase — reported, not yet a hard gate. See docs/auth/FINDINGS.md.
        run: pnpm check:deadcode || true

      - name: Build
        run: pnpm build

      - name: Check client bundle for leaked secret names
        run: pnpm check:bundle-secrets

      - name: Dependency audit
        run: pnpm audit --audit-level=high || true

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:4000

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
