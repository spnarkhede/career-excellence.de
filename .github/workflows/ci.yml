name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      REDIS_URL: redis://localhost:6379
      AUTH_JWT_SECRET: ci-test-secret-ci-test-secret-ci-test
      ENCRYPTION_KEY: ci-test-encryption-key-32-bytes!

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @saas/database generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm --filter @saas/database migrate:deploy

      - name: Seed database (roles and permissions)
        run: pnpm db:seed

      - name: Unit + integration tests
        run: pnpm test

      - name: Database consistency check
        run: pnpm db:check-consistency

      - name: Circular dependency check
        run: pnpm check:cycles

      - name: Duplicate code check
        run: pnpm check:duplicates

      - name: Dead code / unused dependency check
        # Phase 18 task 1: a hard CI gate, not informational. Every real finding from
        # Phase 2 was either fixed (de-exported genuinely dead exports, pinned
        # @nestjs/schematics, routed lint-staged through a package.json script) or is
        # an explicitly documented, reserved-for-a-future-feature exception in
        # knip.json — see docs/auth/FINDINGS.md.
        run: pnpm check:deadcode

      - name: Build
        run: pnpm build

      - name: Check client bundle for leaked secret names
        run: pnpm check:bundle-secrets

      - name: Image size budget (Phase 16 task 2)
        run: pnpm check:image-budget

      - name: Dependency audit (informational)
        # Phase 18 task 1: pnpm's advisory-registry audit is kept informational — it
        # is known to be flaky/rate-limited and its pass/fail is outside this repo's
        # control (a transient registry outage would block every PR). OSV-Scanner
        # below (govulncheck-style, offline OSV.dev database, no registry rate limit)
        # is the real, hard-gating vulnerability check — see docs/auth/FINDINGS.md.
        run: pnpm audit --audit-level=high || true

      - name: OSV vulnerability scan (Phase 18 task 1 — hard gate)
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --recursive

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Lighthouse CI (Phase 16 task 3 — Core Web Vitals + JS size budgets)
        # Runs against apps/web's own production build (already built above by
        # `pnpm build`) via `next start` — see lighthouserc.json. Covers / , /login,
        # /signup; /dashboard is excluded (needs an authenticated session this job
        # has no backend/database to provide — see docs/auth/FINDINGS.md).
        run: pnpm lhci
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:4000

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check for broken links in documentation (Phase 16 task 6)
        run: pnpm check:links

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
